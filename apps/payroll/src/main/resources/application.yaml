server:
  port: 8080
spring:
  application:
    name: payroll

  # Load the workspace-level .env when running `pnpm dev:payroll` locally.
  # In production, process environment variables take precedence.
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oddo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      # Supabase/PgBouncer transaction poolers do not preserve named prepared statements.
      # Disabling them avoids metadata discovery conflicts such as "S_1 already exists".
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:PeoplePay360-dev-jwt-secret-change-in-production-2026}

peoplepay:
  hr-api-url: ${HR_API_URL:http://localhost:3001/api/hr}
  hr-api-jwt-secret: ${HR_API_JWT_SECRET:${JWT_SECRET:PeoplePay360-dev-jwt-secret-change-in-production-2026}}
