spring:
  application:
    name: payroll

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oddo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:PeoplePay360-dev-jwt-secret-change-in-production-2026}

peoplepay:
  hr-api-url: ${HR_API_URL:http://localhost:3001/api/hr}
  hr-api-jwt-secret: ${HR_API_JWT_SECRET:${JWT_SECRET:PeoplePay360-dev-jwt-secret-change-in-production-2026}}
