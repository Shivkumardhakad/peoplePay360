server:
  port: 8081

spring:
  application:
    name: peoplepay360-payroll-api
  datasource:
    url: ${PAYROLL_DATABASE_URL:jdbc:postgresql://localhost:5432/peoplepay360_payroll}
    username: ${PAYROLL_DATABASE_USER:postgres}
    password: ${PAYROLL_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
